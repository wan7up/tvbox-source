name: Weekly Source Maintenance

on:
  schedule:
    # 每周一 03:00 UTC = 北京时间 11:00
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  douer-sync:
    name: Sync douer for MiraPlay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest douer
        run: |
          curl -sL -o miraplay/index.js \
            "https://raw.githubusercontent.com/Darklessing/catvod/main/douer/index.js"
          ls -lh miraplay/index.js

      - name: Apply hide-pan patch
        run: |
          python3 << 'PYEOF'
          import re
          p = 'miraplay/index.js'
          src = open(p, encoding='utf-8', errors='ignore').read()
          # 补丁已打过的标记
          patched_marker = '||o.meta.name.includes("「盘」")'
          if patched_marker in src:
              print("补丁已存在，跳过")
          else:
              # 锚点：].map(o=><var>.has(o.meta.key)?{...o,meta:{...o.meta,hidden:!0}}:o)
              # <var> 是混淆后的变量名，每次上游构建都可能变（如 set -> Aet），用正则匹配
              pat = r"\.map\(o=>(\w+)\.has\(o\.meta\.key\)\?\{...o,meta:\{...o\.meta,hidden:!0\}\}:o\)"
              ms = list(re.finditer(pat, src))
              assert len(ms) == 1, f"锚点匹配到 {len(ms)} 处，预期 1 处；douer 结构可能变了，需人工检查"
              var = ms[0].group(1)
              old = ms[0].group(0)
              new = '.map(o=>(' + var + '.has(o.meta.key)||o.meta.name.includes("「盘」"))?{...o,meta:{...o.meta,hidden:!0}}:o)'
              src = src.replace(old, new)
              open(p, 'w', encoding='utf-8').write(src)
              print(f"补丁已应用（变量名 {var}）")
          PYEOF

      - name: Syntax check and rebuild md5
        run: |
          node --check miraplay/index.js
          node --check miraplay/index.config.js
          cd miraplay
          md5sum index.js | cut -d' ' -f1 | tr -d '\n' > index.js.md5
          md5sum index.config.js | cut -d' ' -f1 | tr -d '\n' > index.config.js.md5
          cat index.js.md5; echo; cat index.config.js.md5; echo

      - name: Extract douer source list and detect new
        run: |
          # 备份上周的清单
          cp miraplay/douer-sources.json /tmp/douer-sources-prev.json 2>/dev/null || echo '{"zhi":[]}' > /tmp/douer-sources-prev.json
          python3 scripts/extract_douer_sources.py miraplay/index.js
          python3 << 'PYEOF'
          import json
          prev = json.load(open('/tmp/douer-sources-prev.json', encoding='utf-8'))
          curr = json.load(open('miraplay/douer-sources.json', encoding='utf-8'))
          prev_keys = {s['key'] for s in prev.get('zhi', [])}
          new = [s for s in curr['zhi'] if s['key'] not in prev_keys]
          if new:
              print("发现 douer 新增「直」源：")
              for s in new:
                  print(f"  + {s['name']} ({s['key']})")
              # 写入待处理文件，触发 TVBox 版搜索
              open('miraplay/new-sources-pending.json', 'w', encoding='utf-8').write(
                  json.dumps(new, ensure_ascii=False, indent=2))
          else:
              print("douer「直」源无新增")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miraplay/index.js miraplay/index.js.md5 miraplay/index.config.js.md5 miraplay/douer-sources.json
          # 如果有新源待处理，也提交
          git add miraplay/new-sources-pending.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "douer 无更新"
          else
            git commit -m "chore(miraplay): weekly douer sync + hide-pan patch [skip ci]"
            git push
          fi

  tvbox-health:
    name: TVBox curated health check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run health check
        run: python scripts/health_check.py

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/status.json
          if git diff --staged --quiet; then
            echo "状态无变化"
          else
            git commit -m "chore(tvbox): weekly health check [skip ci]"
            git push
          fi
