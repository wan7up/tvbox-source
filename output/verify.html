<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVBox 源状态</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
header{background:#16213e;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:20px}
header p{font-size:12px;color:#888;margin-top:4px}
#search{width:calc(100% - 32px);margin:12px 16px;padding:10px;border:1px solid #333;border-radius:8px;background:#16213e;color:#eee;font-size:15px}
#stats{padding:0 16px 8px;font-size:13px;color:#888}
#tabs{display:flex;gap:8px;padding:0 16px 8px;flex-wrap:wrap}
#tabs button{background:#16213e;border:1px solid #333;color:#aaa;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer}
#tabs button.active{background:#e94560;color:#fff;border-color:#e94560}
.site{background:#16213e;margin:8px 16px;border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.site .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:#4caf50}
.site .info{flex:1;min-width:0}
.site .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site .meta{font-size:12px;color:#888;margin-top:2px;word-break:break-all}
.site .check{font-size:12px;margin-top:4px;color:#4caf50}
#loading{text-align:center;padding:40px;color:#888}
.note{background:#16213e;margin:8px 16px;border-radius:10px;padding:12px;font-size:13px;color:#888;line-height:1.8}
.note b{color:#ccc}
</style>
</head>
<body>
<header>
<h1>📺 TVBox 源状态</h1>
<p id="update-time">加载中…</p>
</header>
<div class="note">
<b>数据说明</b><br>
• 本页所有源均经过后端自动检测，<b>每天 10:00 / 22:00 更新</b><br>
• <b>CMS 源</b>：深度验证（取影片列表→取播放地址→确认可出流）<br>
• <b>爬虫源</b>：验证 ext / jar 文件可正常下载<br>
• 检测不通过的源会被自动剔除，不会出现在列表里
</div>
<input id="search" type="search" placeholder="🔍 搜索源名称…">
<div id="tabs">
<button data-f="all" class="active">全部</button>
<button data-f="cms">CMS 源</button>
<button data-f="spider">爬虫源</button>
</div>
<div id="stats"></div>
<div id="list"><div id="loading">加载中…</div></div>
<script>
let sites=[];
const BASE='https://raw.githubusercontent.com/wan7up/tvbox-source/main/output/';
let filter='all', query='';
async function load(){
  try{
    const a=await (await fetch(BASE+'tvbox.json')).json();
    sites=a.sites||[];
    const t=(await (await fetch(BASE+'status.json')).json().catch(()=>({}))).updated_at||'';
    document.getElementById('update-time').textContent='共 '+sites.length+' 个源 · 更新于 '+t.slice(0,16).replace('T',' ');
    render();
  }catch(e){document.getElementById('loading').textContent='加载失败：'+e.message;}
}
function isCms(s){return s.type===0||s.type===1;}
function render(){
  const list=document.getElementById('list');list.innerHTML='';
  let f=sites.filter(s=>(s.name||s.key||'').toLowerCase().includes(query.toLowerCase()));
  if(filter==='cms')f=f.filter(isCms);
  if(filter==='spider')f=f.filter(s=>!isCms(s));
  document.getElementById('stats').textContent='显示 '+f.length+' / '+sites.length;
  f.forEach(s=>{
    const div=document.createElement('div');div.className='site';
    const dot=document.createElement('div');dot.className='dot';
    const inf=document.createElement('div');inf.className='info';
    const nm=document.createElement('div');nm.className='name';nm.textContent=s.name||s.key||'(无名)';
    const mt=document.createElement('div');mt.className='meta';mt.textContent=(isCms(s)?'CMS':'爬虫')+' · '+(s.api||'').slice(0,60);
    const ck=document.createElement('div');ck.className='check';
    ck.textContent=isCms(s)?'✓ 深度验证通过':'✓ 文件可下载';
    inf.appendChild(nm);inf.appendChild(mt);inf.appendChild(ck);
    div.appendChild(dot);div.appendChild(inf);
    list.appendChild(div);
  });
}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');filter=b.dataset.f;render();
});
load();
</script>
</body>
</html>
