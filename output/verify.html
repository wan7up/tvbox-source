<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVBox 源状态</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
header{background:#16213e;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:20px}
header p{font-size:12px;color:#888;margin-top:4px}
#player-wrap{background:#000;position:sticky;top:73px;z-index:9;display:none}
#player{width:100%;max-height:40vh;background:#000}
#player-info{padding:8px 16px;font-size:13px;color:#aaa;background:#0f0f1a}
#search{width:calc(100% - 32px);margin:12px 16px;padding:10px;border:1px solid #333;border-radius:8px;background:#16213e;color:#eee;font-size:15px}
#stats{padding:0 16px 8px;font-size:13px;color:#888}
#tabs{display:flex;gap:8px;padding:0 16px 8px}
#tabs button{background:#16213e;border:1px solid #333;color:#aaa;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer}
#tabs button.active{background:#e94560;color:#fff;border-color:#e94560}
.site{background:#16213e;margin:8px 16px;border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.site .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.ok{background:#4caf50}.dot.fail{background:#f44336}.dot.unknown{background:#666}
.site .info{flex:1;min-width:0}
.site .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site .meta{font-size:12px;color:#888;margin-top:2px}
.site .check{font-size:12px;margin-top:4px}
.check.pass{color:#4caf50}.check.info{color:#888}
.site button{background:#e94560;border:none;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;flex-shrink:0}
.site button:disabled{background:#333;color:#666;cursor:default}
.site button:active:not(:disabled){opacity:.7}
#loading{text-align:center;padding:40px;color:#888}
.note{background:#16213e;margin:8px 16px;border-radius:10px;padding:12px;font-size:13px;color:#888;line-height:1.6}
</style>
</head>
<body>
<header>
<h1>📺 TVBox 源状态</h1>
<p id="update-time">加载中…</p>
</header>
<div id="player-wrap">
<video id="player" controls playsinline></video>
<div id="player-info"></div>
</div>
<div class="note">
<b>说明：</b><br>
• <b>CMS 源</b>（type 0/1）：后端已做深度验证（取片→取播放地址→验证出流），此处可直接试播<br>
• <b>爬虫源</b>（type 3）：后端验证 ext/jar 可下载，真实播放效果需在 TVBox App 内确认
</div>
<input id="search" type="search" placeholder="🔍 搜索源名称…">
<div id="tabs">
<button data-f="all" class="active">全部</button>
<button data-f="cms">CMS 可试播</button>
<button data-f="spider">爬虫源</button>
</div>
<div id="stats"></div>
<div id="list"><div id="loading">加载中…</div></div>
<script>
let sites=[];
const BASE='https://raw.githubusercontent.com/wan7up/tvbox-source/main/output/';
const video=document.getElementById('player'),wrap=document.getElementById('player-wrap'),info=document.getElementById('player-info');
let hls=null, filter='all', query='';
async function load(){
  try{
    const a=await (await fetch(BASE+'tvbox.json')).json();
    sites=a.sites||[];
    document.getElementById('update-time').textContent='共 '+sites.length+' 个源';
    render();
  }catch(e){document.getElementById('loading').textContent='加载失败：'+e.message;}
}
function isCms(s){return s.type===0||s.type===1;}
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  let f=sites.filter(s=>(s.name||'').toLowerCase().includes(query.toLowerCase()));
  if(filter==='cms') f=f.filter(isCms);
  if(filter==='spider') f=f.filter(s=>!isCms(s));
  document.getElementById('stats').textContent='显示 '+f.length+' / '+sites.length;
  f.forEach(s=>{
    const div=document.createElement('div');div.className='site';
    const dot=document.createElement('div');dot.className='dot ok';
    const inf=document.createElement('div');inf.className='info';
    const nm=document.createElement('div');nm.className='name';nm.textContent=s.name||s.key;
    const mt=document.createElement('div');mt.className='meta';
    mt.textContent=(isCms(s)?'CMS':'爬虫')+' | '+(s.api||'').slice(0,45);
    const ck=document.createElement('div');ck.className='check '+(isCms(s)?'pass':'info');
    ck.textContent=isCms(s)?'✓ 后端深度验证通过（可播）':'✓ ext/jar 可下载（播放效果请在 TVBox 确认）';
    inf.appendChild(nm);inf.appendChild(mt);inf.appendChild(ck);
    const btn=document.createElement('button');
    if(isCms(s)){btn.textContent='试播';btn.onclick=()=>testPlay(s);}
    else{btn.textContent='—';btn.disabled=true;}
    div.appendChild(dot);div.appendChild(inf);div.appendChild(btn);
    list.appendChild(div);
  });
}
async function testPlay(s){
  wrap.style.display='block';info.textContent='正在测试 '+(s.name||s.key)+'…';
  wrap.scrollIntoView({behavior:'smooth'});
  try{
    const api=s.api.split(';')[0],sep=api.includes('?')?'&':'?';
    const l=await (await fetch(api+sep+'ac=videolist&pg=1')).json();
    const v=(l.list||[])[0];if(!v)throw '无影片';
    const d=await (await fetch(api+sep+'ac=detail&ids='+(v.vod_id||v.id))).json();
    const dl=(d.list||[])[0]||{};const raw=dl.vod_play_url||'';
    const first=raw.split('#')[0];
    const url=first.includes('$')?first.split('$')[1]:first;
    if(!url||!url.startsWith('http'))throw '无播放地址';
    playUrl(url,s.name);
  }catch(e){info.textContent='❌ 测试失败：'+e;}
}
function playUrl(url,name){
  info.textContent='▶️ '+(name||'');
  if(hls){hls.destroy();hls=null;}
  if(url.includes('.m3u8')&&Hls.isSupported()){
    hls=new Hls();hls.loadSource(url);hls.attachMedia(video);
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)info.textContent='❌ 播放失败';});
  }else{video.src=url;}
  video.play().catch(()=>{info.textContent='⚠️ 点击播放器手动播放';});
}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');filter=b.dataset.f;render();
});
load();
</script>
</body>
</html>
